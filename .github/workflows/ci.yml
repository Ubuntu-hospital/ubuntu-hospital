name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, Lint, Type Check & Build
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      RESEND_BOOKING_TO_EMAIL: ${{ secrets.RESEND_BOOKING_TO_EMAIL }}
      NEXT_PUBLIC_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUD_NAME }}
      NEXT_PUBLIC_CLOUD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUD_PRESET }}
      NEXT_PUBLIC_CLOUD_KEY: ${{ secrets.NEXT_PUBLIC_CLOUD_KEY }}
      NEXT_PUBLIC_CLOUD_KEY_SECRET: ${{ secrets.NEXT_PUBLIC_CLOUD_KEY_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript check
        run: yarn type-check

      - name: Build application
        run: yarn build